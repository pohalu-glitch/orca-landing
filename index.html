<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><script>document.documentElement.classList.add("js")</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORCA 歐卡 | Unigo 微型電動車</title>
<meta name="description" content="ORCA 歐卡 GNF01:CBS 連動煞車、680 mm 長座墊、可拆式鋰電池,六款車色。">
<style>
:root{--red:#e2382d;--bg:#000;--fg:#fff;--muted:#b9b9b9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:540px;margin:0 auto;background:#000;overflow:hidden}
.slice{margin:0;position:relative;line-height:0}
.slice img{display:block;width:100%;height:auto}
.slice{overflow:hidden}
.slice img{will-change:clip-path}
.hero img{transform-origin:50% 100%;animation:zoom 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes zoom{from{transform:scale(1.1)}to{transform:scale(1)}}
.slice{container-type:inline-size}
.tx{position:absolute;white-space:nowrap;margin:0}
.ln{display:block;overflow:hidden;padding:.14em 0;margin:-.14em 0}
.ln>span{display:block}
.js .slice img{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1)}
.js .slice.in img{clip-path:inset(0)}
.js .ln>span{transform:translateY(120%);transition:transform .9s cubic-bezier(.2,.8,.2,1) calc(var(--d,0s) + .3s)}
.js .tx.in .ln>span{transform:none}
.tx{will-change:translate}
.fx{position:absolute;pointer-events:none}
.fx .g{opacity:0;mix-blend-mode:screen}
.fx.in .g{animation:lamp 1.8s ease-out forwards}
.fx.tail.in .g{animation:brake 1.6s ease-out forwards}
@keyframes lamp{0%{opacity:0}12%{opacity:.8}20%{opacity:.1}34%{opacity:.9}44%{opacity:.35}62%,100%{opacity:1}}
@keyframes brake{0%{opacity:.15}15%{opacity:1}30%{opacity:.2}45%{opacity:1}60%{opacity:.2}75%,100%{opacity:.95}}
.tri path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.tri circle{fill:none;stroke:#fff;stroke-width:3;transform-box:fill-box;transform-origin:center;transform:scale(0)}
.fx.in .tri path{animation:draw .9s ease forwards;animation-delay:var(--d)}
.fx.in .tri circle{animation:pop .35s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--d)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.num{display:inline-block;text-align:right;font-weight:inherit;font-variant-numeric:tabular-nums}
.bt{opacity:0}
.hs{position:absolute;width:0;height:0}
.js .hs{opacity:0;transition:opacity .6s .9s}
.js .slice.in .hs{opacity:1}
.dot{position:absolute;left:-2.6cqw;top:-2.6cqw;width:5.2cqw;height:5.2cqw;border-radius:50%;background:#fff;border:.8cqw solid var(--red);padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dot::after{content:"";position:absolute;inset:-.8cqw;border-radius:50%;border:.5cqw solid var(--red);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2);opacity:0}}
.tip{position:absolute;left:0;top:0;white-space:nowrap;background:#111;color:#fff;border-left:.9cqw solid var(--red);padding:1.6cqw 2.6cqw;font-size:3.4cqw;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .25s}
.tip b{display:block;font-weight:700}
.hs.open .tip{opacity:1}
.hs.open{z-index:3}
.cells{position:absolute;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}
.cell{background:transparent;border:0;padding:0;margin:0;cursor:pointer;border-radius:2cqw;transition:background .3s;-webkit-tap-highlight-color:transparent}
.cells.has .cell:not(.sel){background:rgba(255,255,255,.8)}
.cell.sel{box-shadow:inset 0 0 0 .7cqw var(--red)}
.hint0{position:absolute;transform:translateX(-50%);margin:0;font-size:3.2cqw;line-height:1.4;color:#444;white-space:nowrap}
.end{background:#fff;color:#111;padding:28px 24px 120px;text-align:center}
.end p{margin:0 0 18px;font-size:15px;line-height:1.7}
.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:14px 32px;border-radius:999px}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #111}
.end small{display:block;margin-top:22px;color:#666;font-size:12px}
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:100%;background:var(--red);transform:scaleX(0);transform-origin:0 50%;z-index:9}
.cta{position:fixed;left:50%;bottom:0;width:min(540px,100%);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));transform:translate(-50%,110%);transition:transform .4s ease;z-index:8;background:linear-gradient(transparent,rgba(0,0,0,.75) 40%)}
.cta.show{transform:translate(-50%,0)}
.cta .btn{display:block;text-align:center}
@media (prefers-reduced-motion:reduce){.fx .g{opacity:.9!important;animation:none!important}.tri path{stroke-dashoffset:0!important;animation:none!important}.tri circle{transform:none!important;animation:none!important}.dot::after{animation:none}.js .slice img{clip-path:none;transition:none}.js .ln>span{transform:none;transition:none}.slice::after,.hero img{animation:none}.cta{transition:none}}
</style></head><body>
